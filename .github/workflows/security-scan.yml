# ABOUTME: Calls PSD401's reusable security scan on pull requests, pushes to main
# ABOUTME: and a weekly schedule, with read-only repository access.
name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@406c3d2a3881c95086e2b92981b95992e78344d8 # v1.21.0
