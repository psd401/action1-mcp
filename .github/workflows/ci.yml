name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so new advisories (bun audit) and a broken toolchain show
  # up even when nobody pushes.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported line (engines >=22.12, see
        # docs/adr/0001-mcp-sdk-version.md); 24 and 26 are current.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run test
      - run: bun run build

  node-floor:
    # The runtime floor (engines >=22.12) on exactly that release line:
    # build, the test suite and a start of the built server. Lint is not
    # run here: ESLint 10 itself needs Node >=22.13 (docs/CONTRIBUTING.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.x"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: The built server starts and lists the baseline tools
        run: |
          node scripts/tools-list-snapshot.mjs > "$RUNNER_TEMP/tools.json"
          node scripts/assert-baseline-tools.mjs "$RUNNER_TEMP/tools.json"

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # Fails when coverage drops below the thresholds in vitest.config.ts.
      - run: bun run test:coverage

  audit:
    # bun audit reads bun.lock and checks every locked package, dev tools
    # included, so it covers the production tree of deploy-path too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Locked packages must have no high/critical advisories
        run: bun audit --audit-level=high

  deploy-path:
    # The production install from docs/DEPLOYMENT.md (Bare metal / VM,
    # Updating): build, then reinstall only the runtime dependencies
    # (bun install --production does not remove installed dev packages).
    # Checks that no dev package is left and starts the server.
    # Node 22 is the oldest supported production runtime (ADR 0001).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: rm -rf node_modules
      - run: bun install --frozen-lockfile --production --ignore-scripts
      - name: No development package is left
        run: |
          node -e "
          const fs = require('fs');
          const dev = Object.keys(require('./package.json').devDependencies);
          const left = dev.filter((n) => fs.existsSync('node_modules/' + n));
          if (left.length) {
            console.error(left.join('\\n'));
            console.error('::error::The production install left devDependencies installed.');
            process.exit(1);
          }
          "
      - name: The production install starts and lists the baseline tools
        run: |
          node scripts/tools-list-snapshot.mjs > "$RUNNER_TEMP/tools.json"
          node scripts/assert-baseline-tools.mjs "$RUNNER_TEMP/tools.json"

  mcpb-reproducible:
    # Two clean builds of the same commit in separate checkouts (and
    # different umasks) must give a byte-identical .mcpb, so anyone can
    # rebuild a bundle and compare its SHA-256.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build twice
        run: |
          (cd first && umask 0022 && bun install --frozen-lockfile --ignore-scripts && bun run build:mcpb)
          (cd second && umask 0002 && bun install --frozen-lockfile --ignore-scripts && bun run build:mcpb)
      - name: Compare SHA-256 of the bundle
        run: |
          a="$(cd first/dist && sha256sum -- *.mcpb)"
          b="$(cd second/dist && sha256sum -- *.mcpb)"
          echo "first:"; echo "$a"
          echo "second:"; echo "$b"
          if [ "$a" != "$b" ]; then
            diff <(unzip -Z -T first/dist/*.mcpb) <(unzip -Z -T second/dist/*.mcpb) | head -n 40 || true
            echo "::error::The MCPB bundle is not reproducible."
            exit 1
          fi

  codegen-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - name: Verify generated tools are committed
        run: |
          # --porcelain also lists untracked files, so a newly generated
          # file that was never committed fails the check too.
          changes="$(git status --porcelain -- src/tools/generated/ src/codegen/spec/ src/spec/)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/tools/generated/ src/codegen/spec/ src/spec/
            echo "::error::Codegen produced uncommitted changes. Run bun run codegen and commit the result."
            exit 1
          fi

  e2e:
    # Builds the MCPB bundle with scripts/build-mcpb.sh and starts both
    # the compiled stdio server and the unpacked bundle (initialize +
    # tools/list with dummy credentials), runs a tool call against a
    # local HTTPS stub and starts --http; no Action1 API is reached.
    # Node 22 is the oldest supported line, 24 the current one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  cross-os:
    # Windows and macOS: build the MCPB bundle (scripts/build-mcpb.sh runs
    # in Git Bash on Windows), then start the compiled stdio server and
    # the unpacked bundle and check that they list the baseline tools.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build:mcpb
      - name: The stdio server lists the baseline tools
        run: |
          node scripts/tools-list-snapshot.mjs > "$RUNNER_TEMP/tools.json"
          node scripts/assert-baseline-tools.mjs "$RUNNER_TEMP/tools.json"
      - name: The unpacked bundle lists the baseline tools
        run: |
          node node_modules/@anthropic-ai/mcpb/dist/cli/cli.js unpack dist/action1-mcp-*.mcpb "$RUNNER_TEMP/bundle"
          node scripts/tools-list-snapshot.mjs --entry "$RUNNER_TEMP/bundle/server/index.js" \
            > "$RUNNER_TEMP/bundle-tools.json"
          node scripts/assert-baseline-tools.mjs "$RUNNER_TEMP/bundle-tools.json"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history
        # Uses .gitleaks.toml from the repository.
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
