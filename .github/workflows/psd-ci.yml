# ABOUTME: Calls PSD401's reusable CI, which installs with bun, runs the repo's own
# ABOUTME: package.json scripts and a gitleaks scan, on pull requests and pushes to main.
name: PSD CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  psd-ci:
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@406c3d2a3881c95086e2b92981b95992e78344d8 # v1.21.0
